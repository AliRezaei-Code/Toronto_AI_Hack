version: '3.8'

services:
  # Web frontend (Next.js + Remotion)
  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
      - shared-data:/shared-data
      - ./.env:/app/.env:ro
    depends_on:
      - backend
    networks:
      - video-editor-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - SHARED_DATA_DIR=/shared-data
      - MCP_SERVER_URL=http://mcp-server:9000
      - VIDEO_PROCESSOR_URL=http://video-processor:8001
      - REMOTION_PROJECT_PATH=/apps/web
      - RENDERED_SHORTS_DIR=/shared-data/rendered_shorts
    volumes:
      - ./backend:/app
      - shared-data:/shared-data
      - ./.env:/app/.env:ro
    depends_on:
      - mcp-server
      - video-processor
    networks:
      - video-editor-network

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: ../docker/mcp-server.Dockerfile
    ports:
      - "9000:9000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SHARED_DATA_DIR=/shared-data
    volumes:
      - ./mcp-server:/app
      - shared-data:/shared-data
      - ./.env:/app/.env:ro
    networks:
      - video-editor-network

  # AI Director: Face tracking and video analysis sidecar
  video-processor:
    build:
      context: ./video-processor
      dockerfile: ../docker/video-processor.Dockerfile
    ports:
      - "8001:8001"
    environment:
      - TEMP_DIR=/tmp/video-processor
    volumes:
      - shared-data:/shared-data
      - video-processor-temp:/tmp/video-processor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - video-editor-network

volumes:
  shared-data:
    driver: local
  video-processor-temp:
    driver: local
  web-node-modules:
    driver: local

networks:
  video-editor-network:
    driver: bridge
